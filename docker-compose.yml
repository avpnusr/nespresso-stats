services:
  nespresso-stats:
    # Pinned to a release tag on purpose: a moving :latest would let any push to
    # main reach a running install on the next `docker compose pull`. Bump it
    # deliberately after reading a release. `:latest` still exists for the impatient.
    # This repo's CI publishes ghcr.io/avpnusr/nespresso-stats (tag v0.95 → :0.95).
    # The self-hosted Gitea twin publishes the same tags to its own LAN registry —
    # this copy must stay on ghcr.io, do not unify them.
    image: ghcr.io/avpnusr/nespresso-stats:0.95
    ports:
      - "8787:8787"
    environment:
      # Unraid-style uid/gid for the app user (default 99:100).
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      # Where the dashboard is browsed *by name* behind the reverse proxy (e.g.
      # ncs.khmls.net). /api/* through any other name is refused — set this in your .env,
      # or the dashboard answers 403 through the proxy. Direct IP/localhost access and
      # the healthcheck work without it.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # Scanner catalogue pull. Unset keeps the server's default URL; an explicitly empty
      # value disables the pull (an offline install), so this uses `-` and not `:-`.
      CATALOGUE_URL: ${CATALOGUE_URL-https://raw.githubusercontent.com/avpnusr/nespresso-scanner/main/catalogue.json}
      # Comma-separated proxy IPs/CIDRs that may set X-Forwarded-Host (e.g. 192.168.70.10).
      # Empty = the header is ignored (the safe default). A proxy that keeps
      # Host (Caddy's default) needs neither. See README → TRUST_PROXY.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Optional: when set (Bearer token), every /api/* route needs an Authorization
      # header; empty keeps the LAN-trust model. Automation (Stream Deck, curl) sends:
      # Authorization: Bearer <token>
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      # Vision backend for photo identify (README → "Enabling a vision backend").
      # Override in the shell or a .env file next to this file. `-` (not `:-`) on
      # the first two on purpose: an empty value turns vision off.
      VISION_BASE_URL: ${VISION_BASE_URL-http://127.0.0.1:11434/v1}
      VISION_MODEL: ${VISION_MODEL-qwen3.5:4b}
      VISION_API_KEY: ${VISION_API_KEY:-ollama}
    volumes:
      - ./data:/data
    restart: unless-stopped
